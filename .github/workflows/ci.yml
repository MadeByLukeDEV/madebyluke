name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so Next.js build doesn't fail on missing env vars
          DATABASE_URL: mysql://user:password@localhost:3306/madebyluke
          NEXT_PUBLIC_URL: https://madebyluke.dev
          JWT_SECRET: ci-dummy-secret-not-used-in-build
          WEBAUTHN_RP_ID: madebyluke.dev
          WEBAUTHN_RP_NAME: madebyluke.dev
          WEBAUTHN_ORIGIN: https://madebyluke.dev
          RESEND_API_KEY: re_dummy
          RESEND_FROM: noreply@madebyluke.dev
          CONTACT_TO_EMAIL: test@madebyluke.dev

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npx eslint src --ext .ts,.tsx
